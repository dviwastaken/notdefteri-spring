spring.application.name=notdefteri
server.port=8080

# Dosya tabanli H2: uygulama kapansa da veriler ./veri/notdefteri.mv.db dosyasinda kalir
spring.datasource.url=jdbc:h2:file:./veri/notdefteri
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true

# Tarayicidan veritabanini incelemek icin: http://localhost:8080/h2-console
spring.h2.console.enabled=true
